name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The PaySim CSV is 470 MB, gitignored, and not ours to redistribute, so
      # CI cannot train anything. Every test in tests/ runs on small hand-built
      # or fixed-seed synthetic frames and checks the logic that can break
      # silently: the accounting identity behind the balance-discrepancy
      # features, the cost-sensitive threshold search, the time-based split that
      # prevents future-state leakage, and the PSI drift calculation. Training
      # and walk-forward validation stay local steps (see the Makefile).
      #
      # tests/test_export_parity.py is the slow one, around 90 seconds. It
      # scores 20,000 fixed-seed transactions through the pure-Python port the
      # live demo serves and through the committed pickle, and needs both
      # artifacts but no dataset. It is the reason this job takes minutes
      # rather than seconds, and it is worth the time: that port is the one
      # component here that can go wrong without raising anything.
      #
      # Only the packages the tested modules import at module level are needed.
      # shap, optuna, streamlit and plotly are not, so CI skips them.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy<2.3" "pandas>=2.0" "scikit-learn>=1.6" "xgboost>=2.0" joblib pytest

      - name: Run tests
        run: python -m pytest
